events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Root directory
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Handle microfrontends
        location /auth/ {
            alias /usr/share/nginx/html/auth/;
            try_files $uri $uri/ /auth/index.html;
        }

        location /catalog/ {
            alias /usr/share/nginx/html/catalog/;
            try_files $uri $uri/ /catalog/index.html;
        }

        location /shop/ {
            alias /usr/share/nginx/html/shop/;
            try_files $uri $uri/ /shop/index.html;
        }

        location /portal/ {
            alias /usr/share/nginx/html/portal/;
            try_files $uri $uri/ /portal/index.html;
        }

        # Default location
        location / {
            try_files $uri $uri/ /portal/index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}