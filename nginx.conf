events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Root directory
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; connect-src 'self' https:; img-src 'self' https: data: blob:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;

        # Docker injecte l'origine du BFF ; /api conserve son préfixe.
        location = /api { return 308 /api/; }
        location ^~ /api/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $api_upstream "${KUKUZA_API_UPSTREAM}";
            proxy_pass $api_upstream;
            proxy_ssl_server_name on;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;
        }

        location @api_unavailable {
            default_type application/problem+json;
            return 503 '{"title":"API indisponible","status":503}';
        }

        # One SPA entry point handles every feature route.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
