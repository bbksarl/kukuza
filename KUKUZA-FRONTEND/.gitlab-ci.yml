workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - install
  - test
  - build
  - deploy

default:
  image: node:20-alpine
  interruptible: true
  variables:
    CI: "true"
    MICROFRONTS: "auth catalog shop portal"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    NPM_FLAGS: "--no-audit --no-fund --prefer-offline --progress=false"
  cache:
    key:
      files:
        - microfronts/auth/package-lock.json
        - microfronts/catalog/package-lock.json
        - microfronts/shop/package-lock.json
        - microfronts/portal/package-lock.json
    paths:
      - .npm/
      - microfronts/auth/node_modules/
      - microfronts/catalog/node_modules/
      - microfronts/shop/node_modules/
      - microfronts/portal/node_modules/
    policy: pull-push
  before_script:
    - set -euo pipefail

install:
  stage: install
  script:
    - echo "[install] Installing dependencies for microfrontends"
    - |
      for APP in $MICROFRONTS; do
        APP_DIR="microfronts/$APP"
        if [ ! -d "$APP_DIR" ]; then
          echo "[install][$APP] Directory not found, skipping"
          continue
        fi
        if [ ! -f "$APP_DIR/package.json" ]; then
          echo "[install][$APP] package.json not found, skipping"
          continue
        fi

        echo "[install][$APP] Installing dependencies"
        cd "$APP_DIR"
        if [ -f package-lock.json ]; then
          npm ci $NPM_FLAGS
        else
          npm install $NPM_FLAGS
        fi
        cd "$CI_PROJECT_DIR"
      done
  artifacts:
    expire_in: 2h
    paths:
      - microfronts/auth/node_modules/
      - microfronts/catalog/node_modules/
      - microfronts/shop/node_modules/
      - microfronts/portal/node_modules/

test:
  stage: test
  needs:
    - job: install
      artifacts: true
  script:
    - echo "[test] Running tests for microfrontends"
    - |
      FAILED=0
      for APP in $MICROFRONTS; do
        APP_DIR="microfronts/$APP"
        if [ ! -d "$APP_DIR" ]; then
          echo "[test][$APP] Directory not found, skipping"
          continue
        fi
        if [ ! -f "$APP_DIR/package.json" ]; then
          echo "[test][$APP] package.json not found, skipping"
          continue
        fi

        cd "$APP_DIR"
        TEST_SCRIPT="$(npm pkg get scripts.test | tr -d '"' | tr -d '[:space:]' || true)"
        if [ -z "$TEST_SCRIPT" ] || [ "$TEST_SCRIPT" = "null" ]; then
          echo "[test][$APP] No test script, skipping"
          cd "$CI_PROJECT_DIR"
          continue
        fi

        echo "[test][$APP] npm run test -- --watch=false --passWithNoTests"
        if ! npm run test -- --watch=false --passWithNoTests; then
          echo "[test][$APP] Test failed"
          FAILED=1
        fi
        cd "$CI_PROJECT_DIR"
      done

      if [ "$FAILED" -ne 0 ]; then
        echo "[test] One or more test suites failed"
        exit 1
      fi

build:
  stage: build
  needs:
    - job: install
      artifacts: true
    - job: test
  script:
    - echo "[build] Building microfrontends"
    - |
      FAILED=0
      for APP in $MICROFRONTS; do
        APP_DIR="microfronts/$APP"
        if [ ! -d "$APP_DIR" ]; then
          echo "[build][$APP] Directory not found, skipping"
          continue
        fi
        if [ ! -f "$APP_DIR/package.json" ]; then
          echo "[build][$APP] package.json not found, skipping"
          continue
        fi

        echo "[build][$APP] npm run build"
        cd "$APP_DIR"
        if ! npm run build; then
          echo "[build][$APP] Build failed"
          FAILED=1
        fi
        cd "$CI_PROJECT_DIR"
      done

      if [ "$FAILED" -ne 0 ]; then
        echo "[build] One or more builds failed"
        exit 1
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - microfronts/auth/dist/
      - microfronts/auth/build/
      - microfronts/catalog/dist/
      - microfronts/catalog/build/
      - microfronts/shop/dist/
      - microfronts/shop/build/
      - microfronts/portal/dist/
      - microfronts/portal/build/

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - echo "[deploy] Preparing GitLab Pages artifacts"
    - mkdir -p public
    - |
      DEPLOYED=0
      for APP in $MICROFRONTS; do
        DIST_DIR="microfronts/$APP/dist"
        BUILD_DIR="microfronts/$APP/build"
        TARGET_DIR="public/$APP"

        if [ -d "$DIST_DIR" ]; then
          echo "[deploy][$APP] Copying dist"
          mkdir -p "$TARGET_DIR"
          cp -r "$DIST_DIR/." "$TARGET_DIR/"
          DEPLOYED=1
          continue
        fi

        if [ -d "$BUILD_DIR" ]; then
          echo "[deploy][$APP] Copying build"
          mkdir -p "$TARGET_DIR"
          cp -r "$BUILD_DIR/." "$TARGET_DIR/"
          DEPLOYED=1
          continue
        fi

        echo "[deploy][$APP] No dist/build found, skipping"
      done

      if [ "$DEPLOYED" -eq 0 ] || [ -z "$(find public -type f -print -quit)" ]; then
        echo "[deploy] No files found to publish"
        exit 1
      fi
  artifacts:
    paths:
      - public
