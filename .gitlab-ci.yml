workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - test
  - build
  - e2e
  - docker
  - deploy

variables:
  CI: 'true'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  NPM_FLAGS: '--no-audit --no-fund --prefer-offline --progress=false'

default:
  image: node:24-alpine
  interruptible: true
  cache:
    key: 'npm-cache-$CI_COMMIT_REF_SLUG'
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - set -eu

.checks:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:
  extends: .checks
  stage: test
  script:
    - echo "[test] Lint, typecheck, and unit tests for the unified application"
    - cd "$CI_PROJECT_DIR"
    - npm ci $NPM_FLAGS
    - npm audit --audit-level=moderate
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

build:
  extends: .checks
  stage: build
  needs:
    - job: test
  script:
    - echo "[build] Building the unified KUKUZA application"
    - cd "$CI_PROJECT_DIR"
    - npm ci $NPM_FLAGS
    - npm run build
    - cd "$CI_PROJECT_DIR"
    - rm -rf .ci-builds
    - mkdir -p .ci-builds
    - cp -r dist/. .ci-builds/
  artifacts:
    expire_in: 1 week
    paths:
      - .ci-builds/

e2e:
  extends: .checks
  stage: e2e
  image: node:24-alpine
  before_script:
    - set -eu
    - apk add --no-cache chromium
  needs:
    - job: build
      artifacts: true
  script:
    - cd "$CI_PROJECT_DIR"
    - npm ci $NPM_FLAGS
    - mkdir -p dist
    - cp -r .ci-builds/. dist/
    - PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v chromium-browser || command -v chromium)" npm run e2e

docker:develop:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '/certs/client'
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        .
    - docker run -d --rm --name kukuza-container-check "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - trap 'docker rm -f kukuza-container-check >/dev/null 2>&1 || true' EXIT
    - for attempt in $(seq 1 30); do health="$(docker inspect --format '{{.State.Health.Status}}' kukuza-container-check)"; if [ "$health" = healthy ]; then break; fi; sleep 2; done
    - test "$(docker inspect --format '{{.State.Health.Status}}' kukuza-container-check)" = healthy
    - docker rm -f kukuza-container-check >/dev/null
    - trap - EXIT
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  needs:
    - job: build
      artifacts: true
    - job: e2e
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == "main"'

deploy:develop:
  stage: deploy
  image: alpine:latest
  when: manual
  interruptible: false
  resource_group: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "SSH_PRIVATE_KEY is not set"
        exit 1
      fi

      KEY_FILE="$HOME/.ssh/gitlab_deploy_key"
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" "$KEY_FILE"
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$KEY_FILE"
      fi

      tr -d '\r' < "$KEY_FILE" > "${KEY_FILE}.tmp"
      mv "${KEY_FILE}.tmp" "$KEY_FILE"
      chmod 600 "$KEY_FILE"

      eval "$(ssh-agent -s)"
      ssh-add "$KEY_FILE"
    - |
      if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
        echo "SSH_KNOWN_HOSTS must contain a pre-verified host key"
        exit 1
      fi

      if [ -f "$SSH_KNOWN_HOSTS" ]; then
        cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
      else
        printf '%s\n' "$SSH_KNOWN_HOSTS" | sed 's/\\n/\n/g' > ~/.ssh/known_hosts
      fi

      tr -d '\r' < ~/.ssh/known_hosts > ~/.ssh/known_hosts.tmp
      mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
      chmod 644 ~/.ssh/known_hosts
  script:
    - |
      set -eu
      case "$CI_COMMIT_REF_SLUG" in
        (''|*[!a-z0-9-]*) echo "Invalid image tag"; exit 1 ;;
      esac
      case "$CI_REGISTRY_IMAGE" in
        (''|*[!a-zA-Z0-9._/:@-]*) echo "Invalid registry image name"; exit 1 ;;
      esac

      ssh_options="-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
      printf '%s' "$CI_REGISTRY_PASSWORD" | ssh $ssh_options "$SSH_USER@$SSH_HOST" \
        "docker login --username '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"

      ssh $ssh_options "$SSH_USER@$SSH_HOST" sh -s -- "$CI_REGISTRY_IMAGE" "$CI_COMMIT_REF_SLUG" \
        < scripts/deploy-container.sh
  environment:
    name: production
    url: https://kukuza.com
  needs:
    - job: docker:develop
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == "main"'
