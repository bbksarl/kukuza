workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - install
  - test
  - build
  - docker
  - deploy

variables:
  CI: "true"
  MICROFRONTS: "auth catalog shop portal"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NPM_FLAGS: "--no-audit --no-fund --prefer-offline --progress=false"

default:
  image: node:20-alpine
  interruptible: true
  cache:
    key: "npm-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
      - KUKUZA-FRONTEND/microfronts/auth/node_modules/
      - KUKUZA-FRONTEND/microfronts/catalog/node_modules/
      - KUKUZA-FRONTEND/microfronts/shop/node_modules/
      - KUKUZA-FRONTEND/microfronts/portal/node_modules/
    policy: pull-push
  before_script:
    - set -eu

install:
  stage: install
  script:
    - echo "[install] Installing dependencies for microfrontends"
    - |
      for APP in $MICROFRONTS; do
        APP_DIR="KUKUZA-FRONTEND/microfronts/$APP"
        if [ ! -d "$APP_DIR" ]; then
          echo "[install][$APP] Directory not found, skipping"
          continue
        fi
        if [ ! -f "$APP_DIR/package.json" ]; then
          echo "[install][$APP] package.json not found, skipping"
          continue
        fi

        echo "[install][$APP] Installing dependencies"
        cd "$APP_DIR"
        if [ -f package-lock.json ]; then
          npm ci $NPM_FLAGS
        else
          npm install $NPM_FLAGS
        fi
        cd "$CI_PROJECT_DIR"
      done

test:
  stage: test
  needs:
    - job: install
  script:
    - echo "[test] Running tests for microfrontends"
    - |
      FAILED=0
      for APP in $MICROFRONTS; do
        APP_DIR="KUKUZA-FRONTEND/microfronts/$APP"
        if [ ! -d "$APP_DIR" ]; then
          echo "[test][$APP] Directory not found, skipping"
          continue
        fi
        if [ ! -f "$APP_DIR/package.json" ]; then
          echo "[test][$APP] package.json not found, skipping"
          continue
        fi

        cd "$APP_DIR"
        if [ ! -d node_modules ]; then
          echo "[test][$APP] node_modules missing, running install"
          if [ -f package-lock.json ]; then
            npm ci $NPM_FLAGS
          else
            npm install $NPM_FLAGS
          fi
        fi

        if node -e 'const p=require("./package.json"); process.exit(p.scripts && p.scripts.test ? 0 : 1);'; then
          echo "[test][$APP] npm run test -- --watch=false --passWithNoTests"
          if ! npm run test -- --watch=false --passWithNoTests; then
            echo "[test][$APP] Test failed"
            FAILED=1
          fi
        else
          echo "[test][$APP] No test script, skipping"
        fi
        cd "$CI_PROJECT_DIR"
        cd "$CI_PROJECT_DIR"
      done

      if [ "$FAILED" -ne 0 ]; then
        echo "[test] One or more test suites failed"
        exit 1
      fi

build:
  stage: build
  needs:
    - job: install
    - job: test
  script:
    - echo "[build] Building microfrontends"
    - |
      FAILED=0
      BUILT=0
      rm -rf .ci-builds
      mkdir -p .ci-builds
      for APP in $MICROFRONTS; do
        APP_DIR="KUKUZA-FRONTEND/microfronts/$APP"
        if [ ! -d "$APP_DIR" ]; then
          echo "[build][$APP] Directory not found, skipping"
          continue
        fi
        if [ ! -f "$APP_DIR/package.json" ]; then
          echo "[build][$APP] package.json not found, skipping"
          continue
        fi

        cd "$APP_DIR"
        if [ ! -d node_modules ]; then
          echo "[build][$APP] node_modules missing, running install"
          if [ -f package-lock.json ]; then
            npm ci $NPM_FLAGS
          else
            npm install $NPM_FLAGS
          fi
        fi

        echo "[build][$APP] npm run build"
        if ! npm run build; then
          echo "[build][$APP] Build failed"
          FAILED=1
          cd "$CI_PROJECT_DIR"
          continue
        fi

        if [ -d dist ]; then
          mkdir -p "$CI_PROJECT_DIR/.ci-builds/$APP"
          cp -r dist/. "$CI_PROJECT_DIR/.ci-builds/$APP/"
          echo "[build][$APP] Collected dist"
          BUILT=1
        elif [ -d build ]; then
          mkdir -p "$CI_PROJECT_DIR/.ci-builds/$APP"
          cp -r build/. "$CI_PROJECT_DIR/.ci-builds/$APP/"
          echo "[build][$APP] Collected build"
          BUILT=1
        else
          echo "[build][$APP] No dist/build output found"
          FAILED=1
        fi

        cd "$CI_PROJECT_DIR"
      done

      if [ "$FAILED" -ne 0 ]; then
        echo "[build] One or more builds failed"
        exit 1
      fi
      if [ "$BUILT" -eq 0 ]; then
        echo "[build] No build output collected"
        exit 1
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - .ci-builds/

docker:develop:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  needs:
    - job: build
      artifacts: true
  only:
    - develop
    - main

deploy:develop:
  stage: deploy
  image: alpine:latest
  when: manual
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $SSH_USER@$SSH_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG &&
        docker stop kukuza-frontend-$CI_COMMIT_REF_SLUG 2>/dev/null || true &&
        docker rm   kukuza-frontend-$CI_COMMIT_REF_SLUG 2>/dev/null || true &&
        docker run -d \
          --name kukuza-frontend-$CI_COMMIT_REF_SLUG \
          --network kukuza-network \
          --add-host=host.docker.internal:host-gateway \
          --restart unless-stopped \
          -p 3000:80 \
          $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG &&
        docker image prune -f
      "
  environment:
    name: $CI_COMMIT_REF_SLUG
    url: https://www.kukuzaa.com
  needs:
    - job: docker:develop
  only:
    - develop
    - main
