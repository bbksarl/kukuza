workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - install
  - test
  - build
  - deploy

default:
  image: node:20-alpine
  interruptible: true
  variables:
    APP_DIR: KUKUZA-FRONTEND/microfronts/auth
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    NPM_FLAGS: "--no-audit --no-fund --prefer-offline --progress=false"
  cache:
    key:
      files:
        - KUKUZA-FRONTEND/microfronts/auth/package-lock.json
    paths:
      - KUKUZA-FRONTEND/microfronts/auth/node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - cd "$APP_DIR"

install:
  stage: install
  script:
    - npm install $NPM_FLAGS
  artifacts:
    expire_in: 1h
    paths:
      - KUKUZA-FRONTEND/microfronts/auth/node_modules/
      - KUKUZA-FRONTEND/microfronts/auth/package-lock.json

test:
  stage: test
  needs:
    - job: install
      artifacts: true
  script:
    - if [ "$(npm pkg get scripts.test | tr -d '"' | tr -d '[:space:]')" = "null" ]; then echo "Aucun script test détecté, étape test ignorée."; exit 0; fi
    - npm run test -- --watch=false

build:
  stage: build
  needs:
    - job: install
      artifacts: true
    - job: test
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - KUKUZA-FRONTEND/microfronts/auth/dist/
      - KUKUZA-FRONTEND/microfronts/auth/build/

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    - mkdir -p public
    - if [ -d "$APP_DIR/dist" ]; then cp -r "$APP_DIR/dist/." public/; elif [ -d "$APP_DIR/build" ]; then cp -r "$APP_DIR/build/." public/; else echo "No dist/ or build/ directory found"; exit 1; fi
  artifacts:
    paths:
      - public
