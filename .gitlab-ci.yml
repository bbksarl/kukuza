workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - install
  - test
  - build
  - docker
  - deploy

variables:
  CI: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NPM_FLAGS: "--no-audit --no-fund --prefer-offline --progress=false"

default:
  image: node:24-alpine
  interruptible: true
  cache:
    key: "npm-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
      - node_modules/
    policy: pull-push
  before_script:
    - set -eu

install:
  stage: install
  script:
    - echo "[install] Installing the unified KUKUZA application"
    - cd "$CI_PROJECT_DIR"
    - if [ -f package-lock.json ]; then npm ci $NPM_FLAGS; else npm install $NPM_FLAGS; fi

test:
  stage: test
  needs:
    - job: install
  script:
    - echo "[test] Typecheck and UI smoke tests for the unified application"
    - cd "$CI_PROJECT_DIR"
    - npm run lint
    - npm run typecheck
    - npm run test

build:
  stage: build
  needs:
    - job: install
    - job: test
  script:
    - echo "[build] Building the unified KUKUZA application"
    - cd "$CI_PROJECT_DIR"
    - npm run build
    - cd "$CI_PROJECT_DIR"
    - rm -rf .ci-builds
    - mkdir -p .ci-builds
    - cp -r dist/. .ci-builds/
  artifacts:
    expire_in: 1 week
    paths:
      - .ci-builds/

docker:develop:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG \
        -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  needs:
    - job: build
      artifacts: true
  only:
    - develop
    - main

deploy:develop:
  stage: deploy
  image: alpine:latest
  when: manual
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "SSH_PRIVATE_KEY is not set"
        exit 1
      fi

      KEY_FILE="$HOME/.ssh/gitlab_deploy_key"
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" "$KEY_FILE"
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$KEY_FILE"
      fi

      tr -d '\r' < "$KEY_FILE" > "${KEY_FILE}.tmp"
      mv "${KEY_FILE}.tmp" "$KEY_FILE"
      chmod 600 "$KEY_FILE"

      eval "$(ssh-agent -s)"
      ssh-add "$KEY_FILE"
    - |
      if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
        if [ -f "$SSH_KNOWN_HOSTS" ]; then
          cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
        else
          printf '%s\n' "$SSH_KNOWN_HOSTS" | sed 's/\\n/\n/g' > ~/.ssh/known_hosts
        fi
      else
        ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts
      fi

      tr -d '\r' < ~/.ssh/known_hosts > ~/.ssh/known_hosts.tmp
      mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
      chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $SSH_USER@$SSH_HOST "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG &&
        docker stop kukuza-frontend-$CI_COMMIT_REF_SLUG 2>/dev/null || true &&
        docker rm   kukuza-frontend-$CI_COMMIT_REF_SLUG 2>/dev/null || true &&
        docker run -d \
          --name kukuza-frontend-$CI_COMMIT_REF_SLUG \
          --network kukuza-network \
          --add-host=host.docker.internal:host-gateway \
          --restart unless-stopped \
          -p 3000:80 \
          $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG &&
        docker image prune -f
      "
  environment:
    name: $CI_COMMIT_REF_SLUG
    url: https://www.kukuzaa.com
  needs:
    - job: docker:develop
  only:
    - develop
    - main
