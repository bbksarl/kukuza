<section class="shop-dashboard">
  <h1 class="mb-6 text-2xl font-bold">{{ t('shop.products') }}</h1>
  @if (error()) {
    <p role="alert" class="mb-5 rounded bg-red-50 p-4 text-red-700">{{ t('shop.productsUnavailable') }}</p>
  }
  <input [formControl]="search" [placeholder]="t('shop.search')" class="mb-5 rounded border p-3" />
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (p of filtered(); track p.id) {
      <article class="rounded-xl bg-white p-4 shadow-sm">
        <img
          [src]="p.image || '/assets/logo-display.webp'"
          [alt]="p.name"
          class="aspect-[4/3] w-full rounded object-cover"
        />
        <h2 class="mt-3 font-semibold">{{ p.name }}</h2>
        <p>{{ lang.money(p.price) }} · {{ p.stock }} en stock</p>
        <p class="text-sm text-slate-500">{{ p.category }} · {{ p.status }}</p>
        <button class="mt-3 text-red-600" [disabled]="busy()" (click)="remove(p)">
          {{ t('shop.deleteProduct') }}
        </button>
      </article>
    }
  </div>
  @if (!loading() && !filtered().length) {
    <p class="py-8 text-center">{{ t('shop.noProducts') }}</p>
  }
</section>
